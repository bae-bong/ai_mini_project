<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f3c">
  <title>경영지원 AI</title>
  <link rel="stylesheet" href="/assets/styles.css?v=7bee80c68616">
  <script defer src="/assets/vendor/vue.global.prod.js"></script>
  <script defer src="/assets/voice.js?v=76a5ad9563a1"></script>
  <script defer src="/assets/app.js?v=f7c014909408"></script>
</head>
<body>
<svg class="icon-library" aria-hidden="true"><defs>
  <symbol id="chat-icon" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/></symbol>
  <symbol id="folder-icon" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm0 2h18"/></symbol>
  <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="upload-icon" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
  <symbol id="book-icon" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></symbol>
  <symbol id="logout-icon" viewBox="0 0 24 24"><path d="M9 4H4v16h5m5-13 5 5-5 5M8 12h11"/></symbol>
  <symbol id="mic-icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></symbol>
  <symbol id="speaker-icon" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
</defs></svg>

<div id="app" v-cloak>
  <template v-if="isAuthPage">
    <main class="auth-layout">
      <section class="auth-story">
        <a href="/login" class="brand brand-light"><span class="brand-mark" aria-hidden="true">경</span>경영지원 AI</a>
        <div class="story-content">
          <span class="eyebrow">우리 회사의 경영지원 파트너</span>
          <h1>복잡한 경영 질문,<br>근거부터 함께.</h1>
          <p>노무 법령부터 정부 지원사업까지.<br>우리 회사의 정보를 바탕으로 필요한 내용을 찾아보세요.</p>
          <div class="story-feature"><svg class="icon"><use href="#book-icon"/></svg><div><strong>근거가 보이는 경영지원</strong><span>답변과 함께 법령·조항·출처 확인</span></div></div>
          <div class="story-feature"><svg class="icon"><use href="#folder-icon"/></svg><div><strong>우리 회사에 맞춘 안내</strong><span>기업 유형과 상시근로자 수 반영</span></div></div>
        </div>
        <p class="story-footer">중요한 판단은 원문과 전문가 확인을 함께하세요.</p>
      </section>
      <section class="auth-main">
        <div class="auth-card">
          <span class="eyebrow">{{ page === 'signup' ? '처음 오셨나요?' : '다시 만나 반가워요' }}</span>
          <h2>{{ page === 'signup' ? '우리 회사 등록하기' : '로그인' }}</h2>
          <p class="subtext">{{ page === 'signup' ? '기업 정보를 등록하고 맞춤 상담을 시작하세요.' : '경영지원에 필요한 답을 함께 찾아보세요.' }}</p>
          <p v-if="authNotice" class="notice" role="status">{{ authNotice }}</p>
          <form @submit.prevent="submitAuth">
            <label for="username">아이디</label>
            <input id="username" v-model="account.username" name="username" autocomplete="username" maxlength="100" required :disabled="busy" placeholder="사용할 아이디를 입력하세요">
            <label for="password">비밀번호</label>
            <input id="password" v-model="account.password" name="password" type="password" :autocomplete="page === 'signup' ? 'new-password' : 'current-password'" required :disabled="busy" placeholder="비밀번호를 입력하세요">
            <template v-if="page === 'signup'">
              <label for="password-confirm">비밀번호 확인</label>
              <input id="password-confirm" v-model="account.confirm" type="password" autocomplete="new-password" required :disabled="busy" placeholder="비밀번호를 다시 입력하세요">
              <label for="employees">상시근로자 수 <span class="field-note">대표자 제외</span></label>
              <div class="number-input"><input id="employees" v-model="account.employees" name="employees" type="number" min="0" max="2147483647" step="1" required :disabled="busy"><span>명</span></div>
              <fieldset :disabled="busy"><legend>기업 유형 <span class="field-note">선택 사항 · 복수 선택</span></legend>
                <div class="check-grid"><label v-for="type in companyTypes" :key="type" class="check-option"><input v-model="account.types" type="checkbox" :value="type"><span>{{ type }}</span></label></div>
              </fieldset>
            </template>
            <p v-if="error" class="error" role="alert">{{ error }}</p>
            <button class="button primary full" type="submit" :disabled="busy">{{ busy ? '처리 중…' : page === 'signup' ? '가입하고 시작하기' : '로그인' }}<svg v-if="!busy" class="icon"><use href="#arrow-icon"/></svg></button>
          </form>
          <p class="auth-switch">{{ page === 'signup' ? '이미 계정이 있나요?' : '아직 계정이 없나요?' }} <a :href="page === 'signup' ? '/login' : '/signup'">{{ page === 'signup' ? '로그인' : '회원가입' }}</a></p>
        </div>
      </section>
    </main>
  </template>

  <template v-else>
    <div v-if="checking" class="page-loading" role="status">로그인 정보를 확인하고 있어요…</div>
    <div v-else-if="user" class="app-layout">
      <aside class="sidebar">
        <a href="/chat" class="brand"><span class="brand-mark" aria-hidden="true">경</span>경영지원 AI</a>
        <span class="nav-caption">워크스페이스</span>
        <nav aria-label="주 메뉴">
          <a href="/chat" :class="{active: page === 'chat'}" :aria-current="page === 'chat' ? 'page' : undefined"><svg class="icon"><use href="#chat-icon"/></svg>AI 상담</a>
        </nav>
        <section class="company-card" aria-label="현재 기업 정보"><span class="nav-caption">상담에 반영하는 기업 정보</span><strong>{{ user.username }}</strong><p>상시근로자 <b>{{ employeeLabel }}</b></p><div class="tags"><span v-for="type in user.persona.company_types" :key="type">{{ type }}</span><span v-if="!user.persona.company_types.length">기업 유형 미등록</span></div></section>
        <button class="logout" @click="logout" :disabled="busy"><svg class="icon"><use href="#logout-icon"/></svg>로그아웃</button>
      </aside>
      <main class="workspace">
        <header class="workspace-header"><span>{{ page === 'chat' ? 'AI 상담' : '자료 관리' }}</span><span class="header-note">근거와 함께 살펴보는 경영지원</span></header>
        <div class="content">
          <p v-if="sessionError" class="error" role="alert">{{ sessionError }}</p>
          <p class="mobile-company">{{ user.username }} <span>상시근로자 {{ employeeLabel }} · {{ user.persona.company_types.join(' · ') || '기업 유형 미등록' }}</span></p>
          <div class="page-heading"><div><span class="eyebrow">{{ page === 'chat' ? '질문에서 다음 행동까지' : '답변의 시작은 믿을 수 있는 자료' }}</span><h1>{{ page === 'chat' ? '무엇을 도와드릴까요?' : '상담 자료 관리' }}</h1><p class="subtext">{{ page === 'chat' ? '상담 분야를 선택하고 우리 회사의 고민을 물어보세요.' : '상담에 사용하는 자료의 준비 상태를 확인하고 등록하세요.' }}</p></div></div>
          <div class="section-tabs" role="tablist" aria-label="상담 분야"><button v-for="item in sections" :key="item.value" role="tab" :id="item.value + '-tab'" :aria-selected="source === item.value" aria-controls="section-panel" :tabindex="source === item.value ? 0 : -1" :class="{selected: source === item.value}" :disabled="busy || voiceBusy" @click="selectSource(item.value)" @keydown="onTabKey($event, item.value)"><svg class="icon"><use :href="item.value === 'pdf' ? '#book-icon' : '#folder-icon'"/></svg>{{ item.label }}</button></div>
          <section id="section-panel" role="tabpanel" :aria-labelledby="source + '-tab'">
            <div v-if="healthError" class="notice error-notice" role="alert">{{ healthError }} <button class="text-button" @click="loadHealth" :disabled="loadingHealth">다시 확인</button></div>

            <template v-if="page === 'chat'">
              <aside class="voice-guide" aria-labelledby="voice-guide-title">
                <span class="voice-guide-icon" aria-hidden="true"><svg class="icon"><use href="#mic-icon"/></svg></span>
                <div><h2 id="voice-guide-title">말로 질문하고, 답변은 음성으로 들어보세요.</h2><p>선택한 분야의 등록 자료에서 근거를 찾아드려요. 인식한 질문은 검색 전에 수정할 수 있어요.</p>
                  <ol aria-label="음성 상담 순서"><li>말로 질문</li><li>인식한 문장 확인</li><li>답변·출처 확인</li><li>답변 듣기</li></ol>
                </div>
              </aside>
              <div v-if="health && !sourceReady" class="notice"><strong>{{ sourceLabel }} 자료를 준비하고 있어요.</strong><p>{{ source === 'web' ? '사업공고 자료가 등록되면 신청 조건과 기간을 상담할 수 있어요.' : '운영 담당자에게 자료 적재를 요청하세요.' }}</p><button class="text-button" @click="loadHealth" :disabled="loadingHealth">새로고침</button></div>
              <form class="question-card" @submit.prevent="ask">
                <div class="card-label"><span class="small-mark" aria-hidden="true">AI</span><label for="question">{{ sourceLabel }} 질문</label><span class="context-chip">기업 정보 반영</span></div>
                <div class="voice-input">
                  <button v-if="!voiceBusy" class="button voice-start" type="button" aria-describedby="voice-input-help" :disabled="busy || !sourceReady || !voiceSupported" @click="startRecording"><svg class="icon"><use href="#mic-icon"/></svg>음성으로 질문</button>
                  <button v-if="voice.recordingState === 'recording'" class="button recording-button" type="button" aria-describedby="voice-input-help" @click="stopRecording"><span aria-hidden="true">■</span>녹음 완료 · {{ voice.recordingSeconds }}초</button>
                  <span v-if="voice.recordingState === 'requesting' || voice.recordingState === 'transcribing'" class="voice-progress"><span class="spinner" aria-hidden="true"></span>{{ voice.recordingState === 'requesting' ? '마이크 확인 중…' : '음성 인식 중…' }}</span>
                  <button v-if="voiceBusy" class="text-button" type="button" @click="cancelRecording">취소</button>
                  <span id="voice-input-help" class="muted">마이크를 눌러 시작하세요. 최대 60초까지 녹음할 수 있어요.</span>
                </div>
                <p v-if="!voiceSupported" class="voice-note">음성 입력은 HTTPS 또는 localhost에서 지원되는 브라우저로 이용해 주세요. 텍스트 질문은 계속 사용할 수 있어요.</p>
                <p v-if="voice.voiceMessage" class="voice-note" role="status">{{ voice.voiceMessage }}</p>
                <p v-if="voice.voiceError" class="error" role="alert">{{ voice.voiceError }}</p>
                <textarea id="question" v-model="question" maxlength="4000" rows="4" :disabled="busy || voiceBusy" :placeholder="source === 'pdf' ? '예: 상시근로자 3명인 회사에서 연차휴가는 어떻게 적용되나요?' : '예: 청년을 채용할 때 확인할 수 있는 지원사업이 있나요?'" required></textarea>
                <div class="question-footer"><span>{{ question.length }} / 4,000 <span class="privacy-note">· 직원 실명·연락처는 입력하지 마세요.</span></span><button class="button primary" :disabled="!canAsk" type="submit">{{ busy ? '근거를 찾고 있어요…' : '답변 받기' }}<svg v-if="!busy" class="icon"><use href="#arrow-icon"/></svg></button></div>
              </form>
              <p v-if="error" class="error" role="alert">{{ error }}</p>
              <div v-if="busy" class="answer-loading" role="status"><span class="spinner" aria-hidden="true"></span><div><strong>질문에 맞는 근거를 확인하고 있어요.</strong><p>자료를 살펴보고 답변을 정리하는 데 잠시 시간이 걸릴 수 있어요.</p></div></div>
              <template v-else-if="answer">
                <section class="answer-card" aria-live="polite"><div class="answer-heading"><span class="eyebrow">AI 상담 답변</span><span class="status-tag" :class="answer.needs_review ? 'warning' : ''">{{ answer.needs_review ? '전문가 확인 권장' : '근거 원문 확인' }}</span></div><h2>{{ submittedQuestion }}</h2><p class="answer-text">{{ answer.response }}</p><div v-if="answer.persona_applied" class="applied-note">적용된 기업 정보: {{ personaText(answer.persona_applied) }}</div><div v-if="answer.needs_review" class="review-note"><strong>개별 사안은 전문가와 확인하세요.</strong><p>{{ reviewText(answer.review_reason) }}</p></div>
                  <div class="answer-speech">
                    <button v-if="!voice.audioUrl" class="button secondary" type="button" :disabled="voiceBusy || voice.speechLoading || !spokenAnswer.trim() || spokenAnswer.length > 4096" @click="listen"><svg v-if="!voice.speechLoading" class="icon" aria-hidden="true"><use href="#speaker-icon"/></svg><span v-else class="spinner" aria-hidden="true"></span>{{ voice.speechLoading ? '답변 음성을 만들고 있어요…' : '답변 듣기' }}</button>
                    <audio v-if="voice.audioUrl" ref="answerAudio" :src="voice.audioUrl" controls preload="metadata" aria-label="AI 상담 답변 음성"></audio>
                    <p class="voice-note">{{ spokenAnswer.length > 4096 ? '답변이 길어 음성 재생을 지원하지 않아요. 텍스트로 확인해 주세요.' : 'AI가 생성한 음성이에요. 출처는 아래에서 확인해 주세요.' }}</p>
                    <p v-if="voice.speechError" class="error" role="alert">{{ voice.speechError }}</p>
                  </div>
                </section>
                <section class="sources-section"><h2>답변의 근거 <span>{{ answerSources.length }}</span></h2><p v-if="!answerSources.length" class="subtext">확인된 출처가 없어요. 자료에서 근거를 찾지 못한 답변은 판단의 근거로 사용하지 마세요.</p><div v-else class="source-grid"><article v-for="(item, index) in answerSources" :key="index" class="source-card"><span class="source-number">{{ String(index + 1).padStart(2, '0') }}</span><div><span class="source-kind">{{ item.type === 'notice' ? '사업공고' : '경영지원 근거' }}</span><h3>{{ item.title || '출처 제목 없음' }}</h3><p>{{ item.article || '' }}<span v-if="item.page != null"> · {{ item.page }}페이지</span><span v-if="item.period">신청기간 {{ item.period }}</span></p><a v-if="safeUrl(item.url)" :href="safeUrl(item.url)" target="_blank" rel="noopener noreferrer">원문 확인 ↗</a></div></article></div></section>
              </template>
              <section v-else class="suggestions"><h2>이렇게 물어보세요</h2><div class="example-grid"><button v-for="example in examples" :key="example" :disabled="voiceBusy" @click="question = example; focusQuestion()"><span>{{ example }}</span><svg class="icon"><use href="#arrow-icon"/></svg></button></div><p class="quiet-note">AI 답변은 참고용 안내입니다. 적용 조건과 최신 원문을 확인하세요.</p></section>
            </template>

            <template v-else>
              <div class="status-card"><div class="status-symbol" aria-hidden="true"><svg class="icon"><use :href="source === 'pdf' ? '#book-icon' : '#folder-icon'"/></svg></div><div><span class="eyebrow">{{ sourceLabel }} 자료</span><h2>{{ loadingHealth ? '준비 상태 확인 중' : sourceReady ? '상담에 사용할 자료가 있어요' : health ? '아직 등록된 자료가 없어요' : '자료 상태를 확인해 주세요' }}</h2><p class="subtext">{{ sourceReady ? '등록된 자료를 바탕으로 AI 상담을 시작할 수 있어요.' : '자료가 준비되면 이 분야의 상담을 시작할 수 있어요.' }}</p></div><button class="button secondary" @click="loadHealth" :disabled="loadingHealth">{{ loadingHealth ? '확인 중…' : '상태 새로고침' }}</button></div>
              <section class="upload-card document-library" aria-labelledby="document-list-title">
                <div class="section-title"><h2 id="document-list-title">저장된 {{ sourceLabel }} 자료 <span>{{ documents.length }}개</span></h2><button class="button secondary" type="button" :disabled="busy || documentsLoading" @click="loadDocuments">목록 새로고침</button></div>
                <p class="subtext">등록된 문서와 검색용 본문을 확인하고 삭제할 수 있어요. 사업공고는 개요와 첨부를 하나로 묶어서 표시해요.</p>
                <p v-if="documentsLoading" role="status">자료 목록을 불러오고 있어요…</p>
                <p v-if="documentsError" class="error" role="alert">{{ documentsError }}</p>
                <p v-if="documentNotice" class="success-note" role="status">{{ documentNotice }}</p>
                <p v-if="!documentsLoading && !documentsError && !documents.length" class="notice">이 분야에 등록된 자료가 없어요.</p>
                <ul class="saved-documents" aria-label="저장된 문서"><li v-for="item in documents" :key="item.key"><div class="document-summary"><h3>{{ item.title }}</h3><p class="muted">검색 문단 {{ item.chunks }}개</p><p v-for="file in item.files" :key="file" class="document-filename">{{ displayFile(file) }}</p></div><div class="document-actions"><button class="button secondary" type="button" :disabled="busy" @click="previewDocument(item)" :aria-label="item.title + ' 내용 확인'">내용 확인</button><button class="button danger" type="button" :disabled="busy" @click="deleteDocument(item)" :aria-label="item.title + ' 삭제'">삭제</button></div></li></ul>
                <section v-if="selectedDocument" class="document-preview" aria-labelledby="preview-title"><div class="section-title"><h3 id="preview-title">{{ selectedDocument.title }} · 내용 미리보기</h3><button class="text-button" type="button" :disabled="busy" @click="selectedDocument = null">닫기</button></div><p class="muted">저장된 검색 문단 중 최대 3개를 각 1,200자까지 표시해요. 원본 PDF 다운로드는 제공하지 않아요.</p><p v-if="busy && !previewChunks.length" role="status">내용을 불러오고 있어요…</p><article v-for="(chunk, index) in previewChunks" :key="index"><strong>{{ displayFile(chunk.source_file) }}<span v-if="chunk.page"> · {{ chunk.page }}페이지</span><span v-if="chunk.article"> · {{ chunk.article }}</span></strong><p>{{ chunk.text }}</p></article></section>
              </section>
              <section class="upload-card">
                <div class="section-title"><h2>{{ sourceLabel }} 자료 등록</h2><span class="muted">PDF · 파일당 최대 20MB · 최대 20개</span></div>
                <p class="subtext">{{ source === 'pdf' ? '법령·조항 자료를 등록하세요. 경영지원 상담에서 사용합니다.' : '지원사업 공고문·사업 문서를 등록하세요. 사업공고 상담에서 사용합니다.' }}</p>
                <form @submit.prevent="upload">
                  <template v-if="source === 'pdf'"><label for="category">법령 세부 분류</label><select id="category" v-model="category" :disabled="busy || managed"><option value="노무">노무 법령</option><option value="우대기업">기업 지원 근거법</option></select></template>
                  <p v-else class="notice">각 파일을 하나의 사업 문서로 등록해요. 공고명은 파일명을 사용해요. 신청기간·지원대상은 문서 본문에서 확인하며, 별도 구조화 정보는 자동 입력하지 않아요.</p>
                  <label class="file-drop" for="document-file" @dragover.prevent @drop.prevent="dropFiles"><svg class="icon"><use href="#upload-icon"/></svg><strong>PDF를 끌어놓거나 파일을 선택하세요</strong><span>여러 파일을 함께 선택할 수 있어요.</span><input id="document-file" type="file" accept=".pdf,application/pdf" multiple :disabled="busy || managed" @change="chooseFile"></label>
                  <ul class="upload-files" aria-label="등록할 파일"><li v-for="(item, index) in selectedFiles" :key="item.file.name"><div><strong>{{ item.file.name }}</strong><span>{{ fileSize(item.file.size) }} · {{ item.status }}</span><p v-if="item.message" :class="item.status === '실패' ? 'error' : 'subtext'">{{ item.message }}</p></div><button class="text-button" type="button" :disabled="busy" :aria-label="item.file.name + ' 목록에서 제거'" @click="selectedFiles.splice(index, 1)">제거</button></li></ul>
                  <p v-if="managed" class="notice" role="status">법령 일괄 적재 자료는 운영 담당자가 관리해요. 변경이 필요하면 담당자에게 재적재를 요청해 주세요.</p>
                  <p v-if="error" class="error" role="alert">{{ error }}</p>
                  <div v-if="uploadResult" class="success-note" role="status"><p>{{ uploadResult.message }}</p><a href="/chat">상담으로 이동</a></div>
                  <div class="upload-footer"><span class="muted">선택한 분야에 하나씩 등록해요. 동일 파일은 중복 제외하며, 같은 파일명의 수정본은 교체해요.</span><button class="button primary" type="submit" :disabled="busy || managed || !selectedFiles.some(item => ['대기', '실패'].includes(item.status))">{{ busy ? '순서대로 등록 중…' : '등록 / 실패 파일 재시도' }}</button></div>
                </form>
              </section>
              <p class="quiet-note">삭제한 자료는 모든 사용자의 검색에서 제외돼요. 원본 파일과 일괄 적재 입력은 별도로 보관되므로 재적재하면 다시 등록될 수 있어요.</p>
            </template>
          </section>
          <footer class="workspace-footer">경영지원 AI <span>·</span> 판단을 돕는 근거, 결정은 신중하게.</footer>
        </div>
      </main>
    </div>
    <main v-else class="recovery-card"><h1>로그인 정보를 확인할 수 없어요.</h1><p class="error" role="alert">{{ error }}</p><button class="button primary" @click="initialize">다시 확인</button><a href="/login">로그인으로 이동</a></main>
  </template>
</div>
<noscript>이 서비스를 사용하려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
</body>
</html>
