# Optional overlay: docker compose -f compose.yaml -f compose.public.yaml ...
# Keep the private loopback binding from compose.yaml for SSH diagnostics.
services:
  nginx:
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ${PUBLIC_NGINX_CONFIG:-./deploy/nginx/domain-https.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
