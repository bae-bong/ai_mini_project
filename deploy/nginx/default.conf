server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Resolve optional backend services at request time, including after recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_backend http://auth:8080;
    set $rag_backend http://rag:8001;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/auth/signup {
        rewrite ^ /api/signup break;
        proxy_pass $auth_backend;
    }

    location = /api/auth/login {
        rewrite ^ /api/login break;
        proxy_pass $auth_backend;
    }

    location = /api/auth/logout {
        rewrite ^ /api/logout break;
        proxy_pass $auth_backend;
    }

    location = /api/auth/check {
        proxy_pass $auth_backend;
    }

    location /api/auth/ {
        return 404;
    }

    # Preserve the auth team's HTML forms, actions and static resources.
    location ~ ^/(login|signup|home)$ {
        proxy_pass $auth_backend;
    }

    location /static/ {
        proxy_pass $auth_backend;
    }

    location ~ ^/api/(signup|login|logout)$ {
        proxy_pass $auth_backend;
    }

    location /api/rag/ {
        rewrite ^/api/rag/(.*)$ /$1 break;
        proxy_pass $rag_backend;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
