# Certificate bootstrap only: no login or application traffic over plain HTTP.
server {
    listen 80;
    server_name skala-ai.duckdns.org;
    absolute_redirect off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS setup in progress.\n";
    }
}
