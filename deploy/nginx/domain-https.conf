server {
    listen 80;
    server_name skala-ai.duckdns.org;
    absolute_redirect off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://skala-ai.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name skala-ai.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/skala-ai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skala-ai.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Keep Java cookie behavior while preventing transmission over plain HTTP.
    proxy_cookie_flags ~ secure;
    include /etc/nginx/snippets/app.conf;
}
