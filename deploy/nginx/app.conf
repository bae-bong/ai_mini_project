# Shared application routes for private HTTP and public HTTPS.
absolute_redirect off;
root /usr/share/nginx/html;
index index.html;

client_max_body_size 25m;

# Resolve optional backend services at request time, including after recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
set $auth_backend http://auth:8080;
set $rag_backend http://rag:8001;
set $voice_backend http://voice:8008;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /api/auth/signup {
    rewrite ^ /api/signup break;
    proxy_pass $auth_backend;
}

location = /api/auth/login {
    rewrite ^ /api/login break;
    proxy_pass $auth_backend;
}

location = /api/auth/logout {
    rewrite ^ /api/logout break;
    proxy_pass $auth_backend;
}

location = /api/auth/check {
    proxy_pass $auth_backend;
}

location /api/auth/ {
    return 404;
}

location = / {
    return 302 /chat;
}

# Four product pages share the static Vue app. Backend APIs still enforce JWT.
location ~ ^/(login|signup|chat|documents)$ {
    add_header Cache-Control "no-store";
    try_files /app/index.html =404;
}

location /assets/ {
    alias /usr/share/nginx/html/app/assets/;
    # Revalidate assets so a new HTML template cannot reuse stale app state.
    add_header Cache-Control "no-cache";
}

# Preserve legacy auth/demo routes for existing clients.
location = /home {
    proxy_pass $auth_backend;
}

location /static/ {
    proxy_pass $auth_backend;
}

location ~ ^/api/(signup|login|logout)$ {
    proxy_pass $auth_backend;
}

location /api/voice/ {
    client_max_body_size 13m;
    proxy_read_timeout 300s;
    rewrite ^/api/voice/(.*)$ /$1 break;
    proxy_pass $voice_backend;
}

location /api/rag/ {
    rewrite ^/api/rag/(.*)$ /$1 break;
    proxy_pass $rag_backend;
}

location / {
    try_files $uri $uri/ =404;
}
